<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img">
  <style>
    :root { --ink: #1c1b19; --muted: #6e6a61; --rule: #cfcabb; --accent: #8a2a1c; --fill: #f4f1e8; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #e8e4d9; --muted: #958f82; --rule: #45423a; --accent: #e3a47a; --fill: #1d1c19; }
    }
    text { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: var(--ink); }
    .t { font-size: 13px; font-weight: 600; }
    .s { font-size: 10px; fill: var(--muted); }
    .l { font-size: 10px; fill: var(--muted); }
    .band { font-size: 10px; fill: var(--muted); letter-spacing: 1.2px; }
    .box { fill: var(--fill); stroke: var(--ink); stroke-width: 1; }
    .ext { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 3; }
    .a { fill: none; stroke: var(--accent); stroke-width: 1.2; }
    .sep { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 2 4; }
    .head { fill: var(--accent); }
  </style>
  <defs>
    <marker id="e" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 8 4 0 8z"/>
    </marker>
  </defs>

  <text class="band" x="20" y="28">ETHEREUM MAINNET</text>

  <!-- top row -->
  <rect class="ext" x="20" y="60" width="96" height="60"/>
  <text class="t" x="68" y="87" text-anchor="middle">User</text>
  <text class="s" x="68" y="103" text-anchor="middle">holds USDC</text>

  <rect class="box" x="180" y="60" width="160" height="60"/>
  <text class="t" x="260" y="87" text-anchor="middle">USDz</text>
  <text class="s" x="260" y="103" text-anchor="middle">stablecoin · OFT</text>

  <rect class="box" x="410" y="60" width="160" height="60"/>
  <text class="t" x="490" y="87" text-anchor="middle">SPCTPool</text>
  <text class="s" x="490" y="103" text-anchor="middle">KYC-gated collateral</text>

  <rect class="ext" x="640" y="60" width="100" height="60"/>
  <text class="t" x="690" y="87" text-anchor="middle">Credit</text>
  <text class="s" x="690" y="103" text-anchor="middle">off-chain RWA</text>

  <path class="a" d="M116 90H180" marker-start="url(#e)" marker-end="url(#e)"/>
  <text class="l" x="148" y="82" text-anchor="middle">USDC</text>
  <text class="l" x="148" y="106" text-anchor="middle">mint</text>
  <text class="l" x="148" y="118" text-anchor="middle">redeem</text>

  <path class="a" d="M340 90H410" marker-start="url(#e)" marker-end="url(#e)"/>
  <text class="l" x="375" y="82" text-anchor="middle">USDC</text>
  <text class="l" x="375" y="106" text-anchor="middle">SPCT</text>

  <path class="a" d="M570 90H640" marker-start="url(#e)" marker-end="url(#e)"/>
  <text class="l" x="605" y="82" text-anchor="middle">execute</text>
  <text class="l" x="605" y="106" text-anchor="middle">repay</text>

  <!-- oracle -->
  <rect class="box" x="410" y="165" width="160" height="50"/>
  <text class="t" x="490" y="187" text-anchor="middle">SPCT price oracle</text>
  <text class="s" x="490" y="203" text-anchor="middle">Chainlink feed</text>
  <path class="a" d="M410 190H310V120" marker-end="url(#e)"/>
  <text class="l" x="360" y="182" text-anchor="middle">collateral</text>
  <text class="l" x="360" y="204" text-anchor="middle">rate check</text>

  <!-- sUSDz -->
  <rect class="box" x="180" y="250" width="160" height="60"/>
  <text class="t" x="260" y="277" text-anchor="middle">sUSDz</text>
  <text class="s" x="260" y="293" text-anchor="middle">ERC-4626 · cooldown exit</text>
  <path class="a" d="M250 120V250" marker-start="url(#e)" marker-end="url(#e)"/>
  <text class="l" x="242" y="182" text-anchor="end">stake</text>
  <text class="l" x="242" y="194" text-anchor="end">unstake</text>
  <path class="a" d="M410 280H340" marker-end="url(#e)"/>
  <text class="l" x="418" y="284">yield, paid in USDz</text>

  <!-- other chains -->
  <line class="sep" x1="20" y1="335" x2="740" y2="335"/>
  <text class="band" x="740" y="358" text-anchor="end">OTHER CHAINS</text>

  <rect class="box" x="20" y="365" width="130" height="45"/>
  <text class="t" x="85" y="392" text-anchor="middle">child USDz</text>
  <rect class="box" x="180" y="365" width="160" height="45"/>
  <text class="t" x="260" y="392" text-anchor="middle">child sUSDz</text>

  <path class="a" d="M195 120V225H85V365" marker-start="url(#e)" marker-end="url(#e)"/>
  <text class="l" x="93" y="217">bridge</text>
  <path class="a" d="M260 310V365" marker-start="url(#e)" marker-end="url(#e)"/>
  <text class="l" x="268" y="350">OFT adapter</text>
</svg>
